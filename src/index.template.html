<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2f4f7">
<meta name="application-name" content="CLEANSWAP">
<meta name="description" content="Swap bitcoin and USDT both ways, with both sides locked before anything moves.">
<meta name="apple-mobile-web-app-title" content="CLEANSWAP">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CLEANSWAP</title>
<link rel="icon" type="image/png" sizes="64x64" href="data:image/png;base64,__ICON64__">
<link rel="apple-touch-icon" sizes="180x180" href="data:image/png;base64,__ICON180__">
<style>/*__CSS__*/</style>
</head>
<body data-phase="idle" data-mode="practice" data-role="maker" data-dir="btc2u">
<div class="app">

  <header class="top">
    <div class="brand"><img class="mark" src="data:image/png;base64,__ICON64__" alt="" width="26" height="26"><span>CLEANSWAP</span></div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="modePractice" data-act="mode" data-v="practice" class="on" type="button">Practice</button>
      <button id="modeWallet" data-act="mode" data-v="wallet" type="button">Wallet</button>
    </div>
  </header>

  <p class="rate"><span class="dot" id="rateDot"></span><span id="rateTxt">1 BTC ≈ — USDT</span></p>

  <section class="cards" aria-label="Swap amounts">
    <article class="card" id="cardSend">
      <div class="cap">
        <span id="sendCap">You send</span>
        <span class="tag" id="sendTag" hidden><i></i><em id="sendTagTxt">Locked</em></span>
      </div>
      <div class="amt"><b id="sendAmt">50,000</b><span id="sendUnit">sats</span></div>
      <div class="sub" id="sendSub">≈ — USDT</div>
    </article>

    <button class="flip" id="swapDir" data-act="direction" data-v="toggle" type="button" aria-label="Switch direction">⇅</button>

    <article class="card" id="cardGet">
      <div class="cap">
        <span id="getCap">You get</span>
        <span class="tag" id="getTag" hidden><i></i><em id="getTagTxt">Locked</em></span>
      </div>
      <div class="amt"><b id="getAmt">—</b><span id="getUnit">USDT</span></div>
      <div class="sub" id="getSub">≈ 50,000 sats</div>
    </article>
  </section>

  <p class="state" id="stateTxt">Ready</p>

  <section class="act">
    <h1 class="q" id="stepTitle">Swap bitcoin for USDT</h1>
    <p class="say" id="stepSay">Pick an amount, then tap Start swap.</p>

    <div class="presets" id="presets">
      <button data-act="sats" data-v="10000" type="button">10,000</button>
      <button data-act="sats" data-v="50000" class="on" type="button">50,000</button>
      <button data-act="sats" data-v="100000" type="button">100,000</button>
      <button data-act="sats" data-v="250000" type="button">250,000</button>
    </div>

    <label class="field" id="pasteRow" hidden>
      <span class="field-lbl" id="pasteLbl">From your partner</span>
      <input id="pasteIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste it here">
    </label>

    <div class="row" id="inviteRow" hidden>
      <button class="pill" data-act="copyInvite" type="button">Copy link</button>
      <button class="pill" data-act="qrInvite" type="button">QR</button>
    </div>

    <div class="row" id="walletRow" hidden>
      <a class="pill" id="walletLink" href="#">Open in wallet</a>
      <button class="pill" data-act="copyPay" type="button">Copy</button>
      <button class="pill" data-act="qrPay" type="button">QR</button>
    </div>

    <div class="qrbox" id="qrBox"></div>

    <button class="ghost" id="ghost" data-act="reset" type="button" hidden>New swap</button>
  </section>

  <section class="recent" id="history" hidden>
    <p class="recent-h">Recent</p>
    <div id="histList"></div>
  </section>

  <p class="foot" id="foot">No fees · you keep your keys</p>
</div>

<div class="bar"><div class="bar-in">
  <button class="cta" id="primary" data-act="primary" type="button" data-ready="1">Start swap</button>
</div></div>

<div class="toast" id="toast"></div>

<!-- records kept out of the screen: the event log tells a support question
     what happened, and the counterparty string stays for the session -->
<ol class="log" id="log" hidden></ol>
<code id="counterInv" hidden></code>

<script type="text/plain" id="sol-source">/*__SOL__*/</script>
<script type="text/plain" id="sample-bolt11">/*__BOLT11__*/</script>
<script type="text/plain" id="sample-bolt12">/*__BOLT12__*/</script>
<script>/*__QR__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
