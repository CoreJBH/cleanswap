# Build the signed cleanswap.apk from the single-file web app.
#
# The APK is signed with the release key, never the debug key: a debug
# signature cannot update an installed release, and each CI runner would make a
# different one. The key comes from four repository secrets (Settings -> Secrets
# and variables -> Actions); when one is missing the Gradle gate stops the build
# before any APK exists, and this file stops it even earlier when the keystore is
# not there at all.
#   CLEANSWAP_KEYSTORE_BASE64     base64 of the .jks file: base64 -w0 release.jks
#   CLEANSWAP_KEYSTORE_PASSWORD
#   CLEANSWAP_KEY_ALIAS
#   CLEANSWAP_KEY_PASSWORD
#
# There is one workflow for the APK, this one. The copy kept in the tree as
# android/ci/apk-release.yml is byte-for-byte this file, because a push from the
# app cannot write .github/workflows/; a test refuses the two being different.
#
# Every action is pinned to a full commit SHA, so the code this workflow runs is
# the code that was reviewed here and cannot change under the tag it was
# written with.
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build signed cleanswap.apk
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: "8.7"

      - name: Build single-file web app
        run: |
          python3 build.py
          ls -l dist/cleanswap.html

      - name: Stage web app into APK assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          cp dist/cleanswap.html android/app/src/main/assets/index.html
          ls -l android/app/src/main/assets/index.html

      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEANSWAP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::CLEANSWAP_KEYSTORE_BASE64 is not set: a release APK is signed with the release key only."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cleanswap-release.jks"
          echo "CLEANSWAP_KEYSTORE=$RUNNER_TEMP/cleanswap-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        working-directory: android
        env:
          CLEANSWAP_KEYSTORE_PASSWORD: ${{ secrets.CLEANSWAP_KEYSTORE_PASSWORD }}
          CLEANSWAP_KEY_ALIAS: ${{ secrets.CLEANSWAP_KEY_ALIAS }}
          CLEANSWAP_KEY_PASSWORD: ${{ secrets.CLEANSWAP_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" cleanswap.apk
          ls -l cleanswap.apk
          sha256sum cleanswap.apk

      - name: Check the APK carries the release signature
        run: |
          set -euo pipefail
          BT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort | tail -1)"
          "$BT/apksigner" verify --print-certs cleanswap.apk | head -6

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: cleanswap-apk
          path: cleanswap.apk
          if-no-files-found: error
          retention-days: 90
