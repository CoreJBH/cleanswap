# Build cleanswap.apk from the single-file web app.
# GitHub cannot accept workflow files from this repository's automation, so this
# file is tracked here: copy it to .github/workflows/build-apk.yml to enable the
# build (push or "Run workflow").
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build cleanswap.apk
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build single-file web app
        run: |
          python3 build.py
          ls -l dist/cleanswap.html

      - name: Stage web app into APK assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          cp dist/cleanswap.html android/app/src/main/assets/index.html
          ls -l android/app/src/main/assets/index.html

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" cleanswap.apk
          ls -l cleanswap.apk
          sha256sum cleanswap.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanswap-apk
          path: cleanswap.apk
          if-no-files-found: error
          retention-days: 90
